[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hiden"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["hiden/*.py", "tests/*.py"]
exclude = ["hiden/scratch.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Public backwards-compatible re-exports for existing client scripts.
"hiden/massoft_client*.py" = ["F401"]
