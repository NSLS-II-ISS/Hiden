[workspace]
name = "hiden-rga-ioc"
version = "0.1.0"
description = "Hiden RGA MASsoft IOC via caproto"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
caproto = "*"

[activation.env]
# EPICS Channel Access environment (from hiden_config.json epics section)
EPICS_CAS_AUTO_BEACON_ADDR_LIST = "NO"
EPICS_CAS_BEACON_ADDR_LIST = "10.66.59.255"
EPICS_CAS_INTF_ADDR_LIST = "10.66.59.30"

[tasks]
ioc = { cmd = "python cap2_aj2.py", cwd = "hiden", description = "Run the RGA IOC" }
