[workspace]
name = "hiden-rga-ioc"
version = "1.0.0-rc.1"
description = "Hiden RGA MASsoft IOC via caproto"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"

[pypi-dependencies]
caproto = "==1.3.0"

[activation.env]
# Server environment; keep in sync with the defaults in st.cmd.
EPICS_CAS_AUTO_BEACON_ADDR_LIST = "NO"
EPICS_CAS_BEACON_ADDR_LIST = "10.66.59.255"
# Receive broadcast searches on Linux. A specific host IP can miss them.
EPICS_CAS_INTF_ADDR_LIST = "0.0.0.0"

[tasks]
ioc = { cmd = "python cap2_aj2.py", cwd = "hiden", description = "Run the RGA IOC" }
